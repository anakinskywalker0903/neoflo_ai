<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VisionPulse AI</title>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="ai-logo-ring">
          <div class="spinner"></div>
          <div class="core-dot"></div>
        </div>
        <h1 class="brand-title">VisionPulse <span class="badge-ai">AI</span></h1>
      </div>
      <div class="status-pill active" id="statusPill">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Active</span>
      </div>
    </header>

    <!-- Content -->
    <main class="app-main">
      <!-- Toggle Card -->
      <section class="glass-card toggle-card">
        <div class="card-info">
          <span class="card-title">Screen Capture</span>
          <span class="card-sub">Continuous visual AI analysis</span>
        </div>
        <label class="switch-toggle">
          <input type="checkbox" id="trackingToggle" checked />
          <span class="slider"></span>
        </label>
      </section>

      <!-- Live Activity Card -->
      <section class="glass-card activity-card glow-card">
        <div class="activity-top">
          <div class="meta-label">
            <span class="label-text">LAST CAPTURED TAB</span>
            <div class="domain-row">
              <span class="link-icon">🔗</span>
              <strong id="websiteDomain">github.com</strong>
            </div>
          </div>
          <div class="category-badge category-coding" id="categoryTag">Coding</div>
        </div>

        <div class="activity-body">
          <h3 class="activity-title" id="activityTitle">Refactoring Dashboard.tsx</h3>
          <p class="activity-summary" id="activitySummary">"User is reviewing component performance and state."</p>
        </div>

        <div class="activity-footer">
          <span class="bolt-icon">⚡</span>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="confidenceBar" style="width: 98%;"></div>
          </div>
          <span class="conf-text" id="confidenceScore">98% CONF</span>
        </div>
      </section>

      <!-- Settings Card -->
      <section class="glass-card settings-card">
        <label class="meta-label-sm" for="intervalSelect">CAPTURE FREQUENCY</label>
        <div class="select-wrapper">
          <select id="intervalSelect">
            <option value="15">15 Seconds (High Energy)</option>
            <option value="30" selected>30 Seconds (Balanced)</option>
            <option value="60">60 Seconds (Eco Mode)</option>
            <option value="120">120 Seconds (Battery Saver)</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </section>

      <!-- Actions -->
      <section class="actions-group">
        <button class="btn btn-primary" id="captureBtn">
          <span class="btn-icon">📸</span>
          <span>Capture & Analyze Now</span>
        </button>
        <button class="btn btn-secondary" id="dashboardBtn">
          <span class="btn-icon">📊</span>
          <span>Open Dashboard</span>
        </button>
      </section>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
